<!DOCTYPE html><html><head><title>Dashboard</title><script src="https://cdn.tailwindcss.com"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, query, where, addDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = {apiKey: "AIzaSyCLD9yedNA-llM6VU01L9gZ40jv36PlSsw",authDomain: "coincheap-investment.firebaseapp.com",projectId: "coincheap-investment",storageBucket: "coincheap-investment.firebasestorage.app",messagingSenderId: "1065612358336",appId: "1:1065612358336:web:1e9b4678e5df622bc9f325"};
const app = initializeApp(firebaseConfig); const db = getFirestore(app);
let email = localStorage.getItem('currentUser'); if(!email) window.location = 'login.html';

async function addHolding(){
  let coin = prompt("Coin ID: bitcoin, ethereum, solana");
  let amount = parseFloat(prompt("How much do you own?"));
  await addDoc(collection(db, "holdings"), {email, coin, amount, date: new Date()});
  loadPortfolio();
}

async function loadPortfolio(){
  const res = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd');
  const prices = await res.json();
  const q = query(collection(db, "holdings"), where("email", "==", email));
  const snap = await getDocs(q);
  let total = 0; let html = '<table class="w-full"><tr><th>Coin</th><th>Amount</th><th>Value</th></tr>';
  snap.forEach(d => {
    let h = d.data(); let price = prices.find(p => p.id == h.coin)?.current_price || 0;
    let value = h.amount * price; total += value;
    html += `<tr><td>${h.coin}</td><td>${h.amount}</td><td>$${value.toFixed(2)}</td></tr>`;
  });
  document.getElementById('portfolio').innerHTML = html + `</table><p class="text-2xl mt-4">Total: $${total.toFixed(2)}</p>`;
}
loadPortfolio(); window.addHolding = addHolding;
</script></head>
<body class="bg-[#0B1120] text-white p-6"><div class="max-w-5xl mx-auto">
<div class="flex justify-between mb-6"><h1 class="text-3xl font-bold">My Portfolio</h1><a href="index.html" class="text-red-400">Logout</a></div>
<button onclick="addHolding()" class="mb-6 px-6 py-2 bg-green-500 text-black rounded-lg font-bold">+ Add Coin</button>
<div id="portfolio" class="bg-gray-900 p-6 rounded-xl"></div></div></body></html>
