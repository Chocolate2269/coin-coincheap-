<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard - CoinCheap</title>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<style>
body{background:#0a0f1f;color:#fff;font-family:Arial;padding:0;margin:0}
.top{display:flex;justify-content:space-between;padding:14px 20px;background:#0f172a}
.card{background:#1e293b;border:1px solid #2a364f;border-radius:16px;padding:20px;max-width:420px;margin:20px auto}
.bal{font-size:38px;font-weight:900;color:#fbbf24}
button{padding:12px 16px;border-radius:10px;border:none;font-weight:800;cursor:pointer;margin-top:10px;width:100%}
.logout{background:#233044;color:#fff;border:1px solid #2a364f}
.buy{background:#fbbf24;color:#000}
.stat{display:flex;justify-content:space-between;background:#0f172a;padding:12px;border-radius:10px;margin-top:10px;font-size:13px}
</style>
</head>
<body>
<div class="top"><div style="color:#fbbf24;font-weight:900">CoinCheap 💎</div><div id="userEmail" style="font-size:12px;color:#94a3b8"></div></div>
<div class="card">
<h3>Welcome back!</h3>
<div class="bal" id="balance">$0.00</div>
<div class="stat"><span>Daily Profit</span><span style="color:#22c55e">+$0.00</span></div>
<div class="stat"><span>Active Plan</span><span>None yet</span></div>
<button class="buy">💰 Buy Investment Plan</button>
<button class="logout" id="out">Logout</button>
<p style="font-size:11px;color:#64748b;text-align:center;margin-top:12px">Old & new users connected ✅</p>
</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCLD9yedNA-lLM6VU01l9gZ40jv36PlSsw",
  authDomain: "coincheap-investment.firebaseapp.com",
  databaseURL: "https://coincheap-investment-default-rtdb.firebaseio.com",
  projectId: "coincheap-investment",
  storageBucket: "coincheap-investment.firebasestorage.app",
  messagingSenderId: "1065612358336",
  appId: "1:1065612358336:web:1e9b4678e5df622bc9f325"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.database();
auth.onAuthStateChanged(user=>{
  if(!user){location.href="index.html";return}
  document.getElementById('userEmail').textContent=user.email;
  db.ref('users/'+user.uid+'/balance').on('value',s=>{
    document.getElementById('balance').textContent='$'+(s.val()||0)+'.00'
  })
});
document.getElementById('out').onclick=()=>auth.signOut().then(()=>location.href="index.html");
</script>
<script id="chatway" async="true" src="https://cdn.chatway.app/widget.js?id=YcVV5pL9H0KO"></script>
</body>
</html>
