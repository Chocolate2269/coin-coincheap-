<!DOCTYPE html><html><head><title>Admin</title><script src="https://cdn.tailwindcss.com"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig = {apiKey: "AIzaSyCLD9yedNA-llM6VU01L9gZ40jv36PlSsw",authDomain: "coincheap-investment.firebaseapp.com",projectId: "coincheap-investment",storageBucket: "coincheap-investment.firebasestorage.app",messagingSenderId: "1065612358336",appId: "1:1065612358336:web:1e9b4678e5df622bc9f325"};
const app = initializeApp(firebaseConfig); const db = getFirestore(app);
async function render(){
  const usersSnap = await getDocs(collection(db, "users"));
  let userHtml = '<h2 class="text-xl mb-4">All Users</h2><table class="w-full mb-8"><tr class="border-b border-gray-700"><th class="py-2">Email</th><th>Balance</th><th>Action</th></tr>';
  usersSnap.forEach(d => { let u = d.data(); userHtml += `<tr><td class="py-2">${u.email}</td><td>$${u.balance}</td><td><button onclick="addMoney('${d.id}', ${u.balance})" class="bg-green-500 px-3 py-1 rounded">+100</button></td></tr>`});
  document.getElementById('users').innerHTML = userHtml + '</table>';
  const txSnap = await getDocs(collection(db, "transactions"));
  let txHtml = '<h2 class="text-xl mb-4">All Transactions</h2><table class="w-full"><tr class="border-b border-gray-700"><th class="py-2">Email</th><th>Type</th><th>Amount</th><th>Status</th></tr>';
  txSnap.forEach(d => { let t = d.data(); txHtml += `<tr><td class="py-2">${t.email}</td><td>${t.type}</td><td>$${t.amount}</td><td>${t.status}</td></tr>`});
  document.getElementById('tx').innerHTML = txHtml + '</table>';}
window.addMoney = async function(id, bal){ await updateDoc(doc(db, "users", id), {balance: bal + 100}); render(); }
render();
</script></head>
<body class="bg-[#0B1120] text-white p-6"><h1 class="text-3xl font-bold mb-6">Admin - Global View</h1>
<div id="users" class="bg-gray-900 p-6 rounded-xl mb-6 border-gray-800"></div><div id="tx" class="bg-gray-900 p-6 rounded-xl border-gray-800"></div></body></html>
