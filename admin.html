<!DOCTYPE html>
<html lang="en">
<head>
  <title>Admin Dashboard - Wire Coincheap</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *{margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', sans-serif}
    body{background:#0a192f; color:#fff; padding:20px}
    .header{display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; border-bottom:2px solid #22c55e; padding-bottom:15px}
    .logo{font-size:22px; font-weight:800; color:#22c55e}
    .stats{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:15px; margin-bottom:30px}
    .stat-card{background:rgba(34,197,94,0.1); border:1px solid #22c55e; padding:20px; border-radius:12px}
    .stat-card h3{color:#94a3b8; font-size:14px}
    .stat-card .num{font-size:28px; font-weight:800; color:#22c55e; margin-top:5px}
    table{width:100%; background:rgba(255,255,255,0.05); border-radius:12px; overflow:hidden}
    th{background:#22c55e; color:#0a192f; padding:14px; text-align:left; font-weight:700}
    td{padding:14px; border-bottom:1px solid rgba(255,255,255,0.1)}
    .btn{padding:8px 16px; background:#22c55e; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:600}
    .btn-danger{background:#ef4444}
    input{padding:8px; border-radius:6px; border:none; width:100px; margin-right:8px}
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🌍 Admin Control Panel</div>
    <a href="index.html" class="btn btn-outline" style="background:transparent; border:2px solid #22c55e; text-decoration:none">Logout</a>
  </div>

  <div class="stats">
    <div class="stat-card"><h3>Total Users</h3><div class="num" id="totalUsers">0</div></div>
    <div class="stat-card"><h3>Total Deposits</h3><div class="num" id="totalDeposit">$0</div></div>
    <div class="stat-card"><h3>Pending Withdrawals</h3><div class="num" id="pending">0</div></div>
  </div>

  <h2 style="margin-bottom:15px">All Users</h2>
  <table>
    <thead>
      <tr>
        <th>Email</th>
        <th>Country</th>
        <th>Balance</th>
        <th>OTP Verified</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="usersTable">
      <tr><td colspan="5" style="text-align:center">Loading users...</td></tr>
    </tbody>
  </table>

<script>
const SUPABASE_URL = 'YOUR_SUPABASE_URL'
const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY'
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)

async function loadUsers() {
  const { data, error } = await supabase.from('users').select('*').order('created_at', {ascending:false})
  if(error) return console.log(error)
  
  document.getElementById('totalUsers').innerText = data.length
  let tbody = ''
  data.forEach(user => {
    tbody += `
    <tr>
      <td>${user.email}</td>
      <td>${user.country || 'N/A'}</td>
      <td>$${user.balance || 0}</td>
      <td>${user.otp_verified ? '✅ Yes' : '❌ No'}</td>
      <td>
        <input type="number" id="amount-${user.id}" placeholder="Amount">
        <button class="btn" onclick="addBalance('${user.id}')">Add Balance</button>
      </td>
    </tr>`
  })
  document.getElementById('usersTable').innerHTML = tbody
}

async function addBalance(userId) {
  const amount = document.getElementById(`amount-${userId}`).value
  if(!amount) return alert('Enter amount')
  const { data } = await supabase.from('users').select('balance').eq('id', userId).single()
  const newBalance = Number(data.balance) + Number(amount)
  await supabase.from('users').update({balance: newBalance}).eq('id', userId)
  alert(`$${amount} added successfully`)
  loadUsers()
}
