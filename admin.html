<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel – Coincheap Investment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-white antialiased">

  <nav class="flex items-center justify-between px-6 py-4 bg-slate-800">
    <a href="index.html" class="text-emerald-400 text-2xl font-bold">Coincheap Admin</a>
    <a href="index.html" class="text-sm hover:text-emerald-400">← Back to Site</a>
  </nav>

  <div class="max-w-6xl mx-auto px-6 py-12">
    <h1 class="text-3xl font-bold mb-8">Admin Dashboard</h1>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
      <div class="bg-slate-800 p-6 rounded-xl">
        <p class="text-sm text-slate-400">Total Registered Users</p>
        <p class="text-3xl font-bold" id="totalUsers">0</p>
      </div>
      <div class="bg-slate-800 p-6 rounded-xl">
        <p class="text-sm text-slate-400">Total Assets Managed</p>
        <p class="text-3xl font-bold text-emerald-400">$24.5M</p>
      </div>
      <div class="bg-slate-800 p-6 rounded-xl">
        <p class="text-sm text-slate-400">Pending Withdrawals</p>
        <p class="text-3xl font-bold text-yellow-400">5</p>
      </div>
    </div>

    <h2 class="text-2xl font-bold mb-4">Registered Users</h2>
    <div class="bg-slate-800 rounded-xl overflow-hidden">
      <table class="w-full">
        <thead>
          <tr class="border-b border-slate-700">
            <th class="p-3 text-left">Name</th>
            <th class="p-3 text-left">Email</th>
            <th class="p-3 text-left">Balance</th>
            <th class="p-3 text-left">Action</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
        </tbody>
      </table>
      <p id="noUsers" class="p-4 text-slate-400 hidden">No registered users yet.</p>
    </div>
  </div>

  <script id="chatway" async="true" src="https://cdn.chatway.app/widget.js?id=YcVV5pL9H0KO"></script>

  <script>
    let users = JSON.parse(localStorage.getItem('coincheap_users')) || [];

    function saveUsers() {
      localStorage.setItem('coincheap_users', JSON.stringify(users));
    }

    function renderTable() {
      const tbody = document.getElementById('userTableBody');
      const noUsers = document.getElementById('noUsers');
      tbody.innerHTML = '';
      document.getElementById('totalUsers').textContent = users.length;

      if (users.length === 0) {
        noUsers.classList.remove('hidden');
        return;
      }
      noUsers.classList.add('hidden');

      users.forEach((user, index) => {
        const row = document.createElement('tr');
        row.className = 'border-b border-slate-700';
        row.innerHTML = `
          <td class="p-3">${user.name}</td>
          <td class="p-3">${user.email}</td>
          <td class="p-3 font-semibold" id="balance-${index}">$${user.balance.toFixed(2)}</td>
          <td class="p-3">
            <button onclick="addFunds(${index})" class="bg-emerald-500 hover:bg-emerald-600 px-3 py-1 rounded text-sm">Add Funds</button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    function addFunds(index) {
      const amount = prompt('Enter amount to add ($):');
      if (amount === null) return;
      const parsed = parseFloat(amount);
      if (isNaN(parsed) || parsed <= 0) {
        alert('Invalid amount');
        return;
      }
      users[index].balance += parsed;
      saveUsers();
      // Also update current user if this user is currently logged in (in the single-page app)
      const currentUser = JSON.parse(localStorage.getItem('coincheap_current_user'));
      if (currentUser && currentUser.email === users[index].email) {
        currentUser.balance = users[index].balance;
        localStorage.setItem('coincheap_current_user', JSON.stringify(currentUser));
      }
      renderTable();
    }

    // Initial render
    renderTable();
  </script>
</body>
</html>
