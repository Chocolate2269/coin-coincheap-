<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel – Coincheap Investment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-white antialiased">

  <!-- Navbar -->
  <nav class="flex items-center justify-between px-6 py-4 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <a href="index.html" class="text-emerald-400 text-2xl font-bold">Coincheap Admin</a>
    <div class="flex space-x-4 text-sm font-medium">
      <a href="dashboard.html" class="hover:text-emerald-400">Dashboard</a>
      <a href="index.html" class="hover:text-emerald-400">Logout</a>
    </div>
  </nav>

  <!-- Admin Content -->
  <div class="max-w-6xl mx-auto px-6 py-12">
    <h1 class="text-3xl font-bold mb-8">Admin Panel</h1>

    <!-- Stats (static for now) -->
    <div class="grid grid-cols-3 gap-6 mb-12">
      <div class="bg-slate-800 p-6 rounded-xl">
        <p class="text-sm text-slate-400">Total Users</p>
        <p class="text-3xl font-bold" id="totalUsers">–</p>
      </div>
      <div class="bg-slate-800 p-6 rounded-xl">
        <p class="text-sm text-slate-400">Total AUM</p>
        <p class="text-3xl font-bold text-emerald-400">$24.5M</p>
      </div>
      <div class="bg-slate-800 p-6 rounded-xl">
        <p class="text-sm text-slate-400">Pending Withdrawals</p>
        <p class="text-3xl font-bold text-yellow-400">5</p>
      </div>
    </div>

    <!-- User Management Table -->
    <h2 class="text-2xl font-bold mb-4">Registered Users</h2>
    <div class="bg-slate-800 rounded-xl overflow-hidden mb-12">
      <table class="w-full">
        <thead>
          <tr class="border-b border-slate-700">
            <th class="p-3 text-left">Email</th>
            <th class="p-3 text-left">Role</th>
            <th class="p-3 text-left">Status</th>
            <th class="p-3 text-left">Created At</th>
          </tr>
        </thead>
        <tbody id="userTableBody">
          <!-- Dynamic rows will be inserted here -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // Replace with your Render API URL (keep the trailing /api)
    const API_URL = 'https://coincheap-api.onrender.com/api';

    // Check if user is admin
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    const token = localStorage.getItem('token');
    if (!token || user.role !== 'admin') {
      alert('Admin access required');
      window.location.href = 'login.html';
    }

    async function fetchUsers() {
      try {
        const res = await fetch(`${API_URL}/admin/users`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.ok) {
          const users = await res.json();
          document.getElementById('totalUsers').textContent = users.length;
          const tbody = document.getElementById('userTableBody');
          tbody.innerHTML = '';
          users.forEach(u => {
            const row = document.createElement('tr');
            row.className = 'border-b border-slate-700';
            row.innerHTML = `
              <td class="p-3">${u.email}</td>
              <td class="p-3">${u.role}</td>
              <td class="p-3 ${u.is_active ? 'text-emerald-400' : 'text-red-400'}">${u.is_active ? 'Active' : 'Suspended'}</td>
              <td class="p-3">${new Date(u.created_at).toLocaleDateString()}</td>
            `;
            tbody.appendChild(row);
          });
        } else {
          alert('Failed to fetch users. Check admin permissions.');
        }
      } catch (err) {
        alert('Network error: ' + err.message);
      }
    }

    fetchUsers();
  </script>

  <!-- Chatway Widget (optional) -->
  <script id="chatway" async="true" src="https://cdn.chatway.app/widget.js?id=YcVV5pL9H0KO"></script>
</body>
</html>
