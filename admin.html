<!DOCTYPE html>
<html>
<head>
<title>Admin - Wire Coincheap</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{background:#050e22;color:#fff;font-family:Arial;padding:15px}.card{background:#fff;color:#0a192f;padding:20px;border-radius:16px;margin:12px 0}input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px}.btn{padding:12px;background:#22c55e;color:#fff;border:none;border-radius:10px;font-weight:800;cursor:pointer;width:100%}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:8px;font-size:11px}</style>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getFirestore } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyDLxXiMP1_wdPhtHBK8HCRXW__ZrTDSVnc",
  authDomain: "wire-coincheap.firebaseapp.com",
  projectId: "wire-coincheap",
  storageBucket: "wire-coincheap.firebasestorage.app",
  messagingSenderId: "1009275731004",
  appId: "1:1009275731004:web:f2556b9e5f585e12d29739",
  measurementId: "G-VN5D787PG8"
};
const app = initializeApp(firebaseConfig);
window.db=getFirestore(app);
</script>
</head>
<body>
<h2 style="color:#22c55e">Admin Panel - Credit ANY User</h2>
<p style="font-size:11px;color:#94a3b8">wire-coincheap - supportadmin46@gmail.com</p>

<div class="card">
<h3>💰 Credit Balance</h3>
<input id="creditEmail" placeholder="User Email">
<input id="creditAmount" type="number" placeholder="Amount e.g 1000">
<button class="btn" onclick="creditUser()">Credit Now - Updates Firebase</button>
<p id="creditMsg" style="font-weight:700;color:green"></p>
</div>

<div class="card">
<h3>All Users</h3>
<button class="btn" style="background:#0a192f" onclick="loadAll()">Refresh</button>
<div id="userList"></div>
</div>

<div class="card"><h3>Withdrawals + Bank Details</h3><div id="wdList"></div></div>

<script type="module">
import { doc, getDoc, updateDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
window.creditUser = async function(){
 let email=document.getElementById('creditEmail').value.trim().toLowerCase();
 let amt=parseFloat(document.getElementById('creditAmount').value);
 if(!email||!amt) return document.getElementById('creditMsg').innerText='Enter email & amount';
 let ref=doc(window.db,"users",email);
 let snap=await getDoc(ref);
 if(!snap.exists()) return document.getElementById('creditMsg').innerText='❌ User not found in Firebase - user must sign up first';
 let newBal=(parseFloat(snap.data().balance)||0)+amt;
 await updateDoc(ref,{balance:newBal});
 document.getElementById('creditMsg').innerText='✅ Credited $'+amt+' to '+email+' New balance $'+newBal;
 loadAll();
}
window.loadAll = async function(){
 let qs=await getDocs(collection(window.db,"users"));
 let h='<table><tr><th>Email</th><th>Balance</th><th>Action</th></tr>';
 qs.forEach(d=>{let u=d.data(); h+=`<tr><td>${u.email}</td><td>$${u.balance||0}</td><td><button onclick="document.getElementById('creditEmail').value='${u.email}'">Select</button></td></tr>`});
 h+='</table>';
 if(qs.empty) h='No users yet';
 document.getElementById('userList').innerHTML=h;
 let qs2=await getDocs(collection(window.db,"withdrawals"));
 let hh='<table><tr><th>Email</th><th>Amt</th><th>Bank</th><th>Acc</th><th>Routing</th><th>Name</th></tr>';
 qs2.forEach(d=>{let w=d.data(); hh+=`<tr><td>${w.email}</td><td>$${w.amount}</td><td>${w.bank}</td><td>${w.acc}</td><td>${w.routing}</td><td>${w.name}</td></tr>`});
 hh+='</table>';
 if(qs2.empty) hh='No withdrawals yet';
 document.getElementById('wdList').innerHTML=hh;
}
setTimeout(()=>loadAll(),1200);
</script>
</body>
</html>
