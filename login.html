<!DOCTYPE html>
<html><head><title>Login</title><meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{background:#0a192f; color:#fff; display:flex; justify-content:center; align-items:center; min-height:100vh; font-family:Arial} .box{background:white; color:#0a192f; padding:30px; border-radius:16px; width:90%; max-width:380px} input{width:100%; padding:12px; margin:10px 0; border-radius:8px; border:1px solid #ccc} .btn{width:100%; padding:12px; background:#22c55e; color:white; border:none; border-radius:8px; font-weight:700}</style>
</head><body>
<div class="box">
<h2>Login</h2>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button class="btn" onclick="login()">Login</button>
<p style="margin-top:15px"><a href="register.html" style="color:#22c55e">Create Account</a></p>
</div>
<script>
const supabase=window.supabase.createClient('YOUR_SUPABASE_URL','YOUR_SUPABASE_ANON_KEY')
async function login(){
  const {data,error}=await supabase.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value})
  if(error) alert(error.message); else location.href='dashboard.html'
}
</script></body></html>
