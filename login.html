<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login - Coincheap Investment</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}body{background:#0a192f;display:flex;justify-content:center;align-items:center;min-height:100vh}
.box{background:#fff;color:#0a192f;padding:30px;border-radius:16px;width:92%;max-width:400px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
input{width:100%;padding:14px;margin:10px 0;border-radius:10px;border:2px solid #c7d2fe;font-size:16px}
.btn{width:100%;padding:14px;background:linear-gradient(90deg,#f59e0b,#d97706);color:#fff;border:none;border-radius:12px;font-weight:900;font-size:16px;cursor:pointer;margin-top:10px}
a{color:#f59e0b;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="box">
<h2 style="text-align:center;color:#1e3a8a">🔑 Login</h2>
<p style="text-align:center;color:#64748b;font-size:13px">Coincheap Investment</p>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button class="btn" onclick="login()">LOGIN & OPEN DASHBOARD</button>
<p id="msg" style="text-align:center;font-weight:900;margin-top:12px"></p>
<p style="text-align:center;margin-top:15px">No account? <a href="register.html">Create Account</a></p>
<p style="text-align:center;margin-top:8px"><a href="index.html" style="color:#1e3a8a">← Home</a></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";
const firebaseConfig = {
  apiKey: "AIzaSyCLD9yedNA-llM6VU01L9gZ40jv36PlSsw",
  authDomain: "coincheap-investment.firebaseapp.com",
  databaseURL: "https://coincheap-investment-default-rtdb.firebaseio.com",
  projectId: "coincheap-investment",
  storageBucket: "coincheap-investment.firebasestorage.app",
  messagingSenderId: "1065612358336",
  appId: "1:1065612358336:web:1e9b4678e5df622bc9f325"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// Auto-fill email from register
let params=new URLSearchParams(location.search); if(params.get('email')) document.getElementById('email').value=params.get('email');

window.login = async function(){
 let email=document.getElementById('email').value.trim().toLowerCase();
 let password=document.getElementById('password').value;
 if(!email||!password){document.getElementById('msg').innerText='Fill all';return;}
 document.getElementById('msg').innerText='Checking...'; document.getElementById('msg').style.color='#1e3a8a';
 try{
   let key=email.replace(/[^a-zA-Z0-9]/g,'_');
   let snap=await get(ref(db,'users/'+key));
   if(!snap.exists()){document.getElementById('msg').innerText='No account found - Register first'; document.getElementById('msg').style.color='red'; return;}
   if(snap.val().password!=password){document.getElementById('msg').innerText='Wrong password'; document.getElementById('msg').style.color='red'; return;}
   localStorage.setItem('current_user',email);
   document.getElementById('msg').innerText='✅ Success! Opening Dashboard...'; document.getElementById('msg').style.color='green';
   setTimeout(()=>location.href='index.html',1000);
 }catch(err){document.getElementById('msg').innerText='Error: '+err.message;}
}
</script>
</body>
</html>
