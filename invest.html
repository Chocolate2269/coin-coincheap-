<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invest – Coincheap Investment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-white antialiased">

  <!-- Navbar -->
  <nav class="flex items-center justify-between px-6 py-4 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <a href="index.html" class="text-emerald-400 text-2xl font-bold">Coincheap</a>
    <div class="flex space-x-4 text-sm font-medium">
      <a href="dashboard.html" class="hover:text-emerald-400">Dashboard</a>
      <a href="invest.html" class="text-emerald-400">Invest</a>
      <a href="portfolio.html" class="hover:text-emerald-400">Portfolio</a>
      <a href="withdraw.html" class="hover:text-emerald-400">Withdraw</a>
      <a href="index.html" class="hover:text-emerald-400">Logout</a>
    </div>
  </nav>

  <!-- Invest Content -->
  <div class="max-w-4xl mx-auto px-6 py-12">
    <h1 class="text-3xl font-bold mb-8">Invest in Curated Assets</h1>

    <!-- Asset List -->
    <div class="grid md:grid-cols-2 gap-6 mb-12">
      <!-- Bitcoin -->
      <div class="bg-slate-800 p-6 rounded-xl">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-xl font-semibold">Bitcoin (BTC)</h3>
          <span class="text-emerald-400 font-bold">$65,000</span>
        </div>
        <p class="text-slate-400 text-sm mb-2">APY: 3.5% | Min: $10</p>
        <button class="bg-emerald-500 hover:bg-emerald-600 px-4 py-2 rounded-lg text-sm font-semibold">Invest</button>
      </div>
      <!-- Ethereum -->
      <div class="bg-slate-800 p-6 rounded-xl">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-xl font-semibold">Ethereum (ETH)</h3>
          <span class="text-emerald-400 font-bold">$3,500</span>
        </div>
        <p class="text-slate-400 text-sm mb-2">APY: 4.0% | Min: $10</p>
        <button class="bg-emerald-500 hover:bg-emerald-600 px-4 py-2 rounded-lg text-sm font-semibold">Invest</button>
      </div>
      <!-- USDT -->
      <div class="bg-slate-800 p-6 rounded-xl">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-xl font-semibold">Tether (USDT)</h3>
          <span class="text-emerald-400 font-bold">$1.00</span>
        </div>
        <p class="text-slate-400 text-sm mb-2">APY: 5.0% | Min: $10</p>
        <button class="bg-emerald-500 hover:bg-emerald-600 px-4 py-2 rounded-lg text-sm font-semibold">Invest</button>
      </div>
      <!-- Solana -->
      <div class="bg-slate-800 p-6 rounded-xl">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-xl font-semibold">Solana (SOL)</h3>
          <span class="text-emerald-400 font-bold">$150</span>
        </div>
        <p class="text-slate-400 text-sm mb-2">APY: 6.0% | Min: $10</p>
        <button class="bg-emerald-500 hover:bg-emerald-600 px-4 py-2 rounded-lg text-sm font-semibold">Invest</button>
      </div>
    </div>

    <!-- Investment Form (Simulated) -->
    <div class="bg-slate-800 p-6 rounded-xl">
      <h2 class="text-xl font-semibold mb-4">Quick Invest</h2>
      <form onsubmit="alert('Investment simulated!'); return false;">
        <div class="mb-4">
          <label class="block text-sm mb-2">Select Asset</label>
          <select class="w-full p-3 bg-slate-700 rounded">
            <option>Bitcoin (BTC)</option>
            <option>Ethereum (ETH)</option>
            <option>Tether (USDT)</option>
            <option>Solana (SOL)</option>
          </select>
        </div>
        <div class="mb-6">
          <label class="block text-sm mb-2">Amount (USD)</label>
          <input type="number" placeholder="10" class="w-full p-3 bg-slate-700 rounded" min="10" required>
        </div>
        <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 p-3 rounded-lg font-semibold">Confirm Investment</button>
      </form>
    </div>
  </div>

  <!-- Chatway Widget -->
  <script id="chatway" async="true" src="https://cdn.chatway.app/widget.js?id=YcVV5pL9H0KO"></script>
</body>
</html>
