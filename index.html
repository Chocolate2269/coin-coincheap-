<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoinCheap - Invest</title>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<style>
body{font-family:Arial;background:#0f172a;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px}
.card{background:#1e293b;padding:25px;border-radius:15px;width:100%;max-width:400px}
h2{text-align:center;color:#f59e0b}
input{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff;box-sizing:border-box;font-size:16px}
button{width:100%;padding:14px;margin-top:10px;border-radius:10px;border:none;background:#f59e0b;color:#000;font-weight:bold;font-size:16px}
.small{font-size:12px;color:#94a3b8;text-align:center;margin-top:8px}
</style>
</head>
<body>
<div class="card">
<h2>CoinCheap 💎</h2>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="signup()">Create Account</button>
<button onclick="login()" style="background:#334155;color:#fff">Login</button>
<p id="msg" class="small"></p>
<p class="small">Balance: <span id="bal">$0</span></p>
</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCLD9yedNA-l1M6VU01L9gZ40jv36PlSsw",
  authDomain: "coincheap-investment.firebaseapp.com",
  databaseURL: "https://coincheap-investment-default-rtdb.firebaseio.com",
  projectId: "coincheap-investment",
  storageBucket: "coincheap-investment.firebasestorage.app",
  messagingSenderId: "1065612358336",
  appId: "1:1065612358336:web:1e9b4678e5df622bc9f325",
  measurementId: "G-EM6F4CS1C6"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
function signup(){
  const email=document.getElementById('email').value.trim();
  const pass=document.getElementById('password').value;
  document.getElementById('msg').innerText='Creating...';
  auth.createUserWithEmailAndPassword(email,pass).then(cred=>{
    return db.ref('users/'+cred.user.uid).set({email:email.toLowerCase(),balance:0,created:new Date().toISOString()});
  }).then(()=>{document.getElementById('msg').innerText='✅ Created! Now Login';}).catch(e=>{document.getElementById('msg').innerText='❌ '+e.message;});
}
function login(){
  const email=document.getElementById('email').value.trim();
  const pass=document.getElementById('password').value;
  document.getElementById('msg').innerText='Logging in...';
  auth.signInWithEmailAndPassword(email,pass).then(cred=>{
    db.ref('users/'+cred.user.uid+'/balance').on('value',s=>{document.getElementById('bal').innerText='$'+(s.val()||0);});
    document.getElementById('msg').innerText='✅ Welcome '+email;
  }).catch(e=>{document.getElementById('msg').innerText='❌ '+e.message;});
}
</script>
</body>
</html>
