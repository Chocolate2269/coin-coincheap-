<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CoinCheap USA</title>
<style>
*{box-sizing:border-box;font-family:system-ui,Arial}body{margin:0;background:#020617;color:#e2e8f0}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#020617;position:sticky;top:0;z-index:10;border-bottom:1px solid #1e293b}
.logo{font-weight:900;font-size:22px}.logo span{color:#f59e0b}
.btn{padding:10px 18px;border:none;border-radius:10px;font-weight:800;cursor:pointer}
.btn-dark{background:#0f172a;color:#fff;border:1px solid #334155}
.btn-yellow{background:#f59e0b;color:#000}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px}
.stat{background:#0f172a;border-radius:16px;padding:14px;text-align:center;border:1px solid #1e293b}
.stat b{font-size:22px;display:block}
.preview{margin:12px;background:#fff;color:#0f172a;border-radius:20px;padding:16px;border:3px solid #f59e0b;position:relative}
.most{position:absolute;top:-12px;right:12px;background:#f59e0b;color:#000;font-weight:900;padding:4px 12px;border-radius:20px;font-size:12px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99;align-items:center;justify-content:center;padding:12px}
.modal.show{display:flex}.box{background:#fff;color:#0f172a;padding:18px;border-radius:16px;width:100%;max-width:380px}
input{width:100%;padding:12px;margin:6px 0;border:2px solid #cbd5e1;border-radius:10px}
.green{background:#16a34a;color:#fff}.blue{background:#1e3a8a;color:#fff}
</style>
</head>
<body>

<div class="header">
<div class="logo">CoinCheap <span>USA</span> 🇺🇸</div>
<div style="display:flex;gap:8px">
<button class="btn btn-dark" onclick="openLogin()">Login</button>
<button class="btn btn-yellow" onclick="openSignup()">Get Started</button>
</div>
</div>

<div class="stats">
<div class="stat"><b>12K+</b>Active Investors</div>
<div class="stat"><b>$4.2M+</b>Total Payout</div>
<div class="stat"><b>USA</b>Bank Verified</div>
</div>

<div class="preview">
<div class="most">MOST POPULAR</div>
<h3>📈 Live Account Preview</h3>
<div style="text-align:center">
<p>Current Balance</p>
<h1 style="color:#f59e0b;margin:0;font-size:42px">$0.00</h1>
<p>Login to view your portfolio</p>
<div style="display:flex;gap:8px;margin-top:12px">
<button class="btn green" style="flex:1" onclick="openSignup()">Deposit</button>
<button class="btn blue" style="flex:1" onclick="openLogin()">Withdraw</button>
</div>
<p style="color:#ef4444;font-size:11px;margin-top:10px">⚠️ Investment involves risk. Past performance not guarantee.</p>
</div>
</div>

<!-- SIGNUP MODAL -->
<div id="signupModal" class="modal"><div class="box">
<h3>Create Account</h3>
<input id="suName" placeholder="Full Name">
<input id="suEmail" placeholder="Email">
<input id="suPass" type="password" placeholder="Password">
<button class="btn btn-yellow" style="width:100%" onclick="doSignup()">Create Account</button>
<p style="text-align:center;margin-top:10px">Already have? <a href="#" onclick="openLogin()">Login</a></p>
<button class="btn btn-dark" style="width:100%;margin-top:8px" onclick="closeAll()">Close</button>
<p id="suMsg"></p>
</div></div>

<!-- LOGIN MODAL -->
<div id="loginModal" class="modal"><div class="box">
<h3>Welcome Back</h3>
<input id="liEmail" placeholder="Email">
<input id="liPass" type="password" placeholder="Password">
<button class="btn blue" style="width:100%" onclick="doLogin()">Login</button>
<p style="text-align:center;margin-top:10px">No account? <a href="#" onclick="openSignup()">Create</a></p>
<button class="btn btn-dark" style="width:100%;margin-top:8px" onclick="closeAll()">Close</button>
<p id="liMsg"></p>
</div></div>

<script type="module">
// Firebase (if you use)
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
const firebaseConfig = {
  apiKey: "AIzaSyDUMMY-REPLACE-WITH-YOURS",
  authDomain: "your-project.firebaseapp.com",
  projectId: "your-project",
};
try{ initializeApp(firebaseConfig); }catch(e){}

window.openSignup = ()=>{closeAll(); document.getElementById('signupModal').classList.add('show');}
window.openLogin = ()=>{closeAll(); document.getElementById('loginModal').classList.add('show');}
window.closeAll = ()=>{document.querySelectorAll('.modal').forEach(m=>m.classList.remove('show'));}

window.doSignup = ()=>{
let name=document.getElementById('suName').value;
let email=document.getElementById('suEmail').value;
let pass=document.getElementById('suPass').value;
if(!email||!pass){document.getElementById('suMsg').innerText='Fill all';return;}
localStorage.setItem('userEmail',email);
localStorage.setItem('userName',name);
document.getElementById('suMsg').innerText='✅ Account created! Redirecting to Login...';
setTimeout(()=>{ closeAll(); openLogin(); document.getElementById('liEmail').value=email; document.getElementById('liMsg').innerText='✅ Now login with your new account'; },1200);
}

window.doLogin = ()=>{
let email=document.getElementById('liEmail').value;
if(!email){document.getElementById('liMsg').innerText='Enter email';return;}
localStorage.setItem('userEmail',email);
document.getElementById('liMsg').innerText='✅ Login success! Redirecting...';
setTimeout(()=>{ window.location.href='dashboard.html'; },1000);
}
</script>
</body>
</html>
