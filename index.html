<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CoinCheap 💎</title>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a0f1f;color:#fff}
nav{display:flex;justify-content:space-between;padding:14px 20px;background:#0f172a}
.logo{color:#fbbf24;font-weight:900}
.auth{padding:40px 16px}
.card{background:#1f2c45;border:1px solid #2a3a5a;padding:22px;border-radius:18px;max-width:380px;margin:0 auto}
input{width:100%;padding:14px;margin:6px 0;border-radius:10px;border:1px solid #2a3a5a;background:#0f172a;color:#fff}
button{width:100%;padding:14px;margin-top:10px;border-radius:10px;border:none;background:#fbbf24;color:#000;font-weight:900}
#btnLogin{background:#233044;color:#fff;border:1px solid #2a3a5a}
.small{font-size:12px;color:#94a3b8;text-align:center;margin-top:8px;min-height:18px}
</style>
</head>
<body>
<nav><div class="logo">CoinCheap 💎</div></nav>
<div class="auth"><div class="card">
<h2 style="text-align:center;color:#fbbf24">CoinCheap 💎</h2>
<p style="text-align:center;color:#64748b;font-size:12px;margin-bottom:12px">Login to access dashboard</p>
<input id="userEmail" type="email" placeholder="Email">
<input id="userPass" type="password" placeholder="Password (6+ chars)">
<button id="btnSignup">Create Account →</button>
<button id="btnLogin">Login → Dashboard</button>
<p id="msg" class="small"></p>
</div></div>
<script>
const firebaseConfig = {
apiKey: "AIzaSyCLD9yedNA-lLM6VU01l9gZ40jv36PlSsw",
  authDomain: "coincheap-investment.firebaseapp.com",
  databaseURL: "https://coincheap-investment-default-rtdb.firebaseio.com",
  projectId: "coincheap-investment",
  storageBucket: "coincheap-investment.firebasestorage.app",
  messagingSenderId: "1065612358336",
  appId: "1:1065612358336:web:1e9b4678e5df622bc9f325",
  measurementId: "G-EM6F4CS1C6"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.database();
auth.onAuthStateChanged(user=>{ if(user){ location.href="dashboard.html"; }});
document.getElementById('btnSignup').onclick=()=>{
  const e=document.getElementById('userEmail').value.trim();
  const p=document.getElementById('userPass').value.trim();
  const m=document.getElementById('msg');
  if(!e.includes('@')){m.textContent='⚠️ Enter email';return}
  if(p.length<6){m.textContent='⚠️ Password 6+';return}
  m.textContent='Creating...';
  auth.createUserWithEmailAndPassword(e,p)
    .then(c=>db.ref('users/'+c.user.uid).set({email:e.toLowerCase(),balance:0,created:Date.now()}))
    .then(()=>{m.textContent='✅ Created! Redirecting...'; setTimeout(()=>location.href="dashboard.html",1000);})
    .catch(err=>m.textContent='❌ '+err.message);
};
document.getElementById('btnLogin').onclick=()=>{
  const e=document.getElementById('userEmail').value.trim();
  const p=document.getElementById('userPass').value.trim();
  const m=document.getElementById('msg');
  if(!e||!p){m.textContent='⚠️ Enter email & password';return}
  m.textContent='Logging in...';
  auth.signInWithEmailAndPassword(e,p)
    .then(()=>{m.textContent='✅ Success! Redirecting...'; setTimeout(()=>location.href="dashboard.html",800);})
    .catch(err=>m.textContent='❌ '+err.message);
};
</script>
<script id="chatway" async="true" src="https://cdn.chatway.app/widget.js?id=YcVV5pL9H0KO"></script>
</body>
</html>
