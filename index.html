<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CoinCheap - Premium</title>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a0f1f;color:#fff}
nav{display:flex;justify-content:space-between;padding:14px 20px;background:#0f172a;border-bottom:1px solid #1e293b}
.logo{color:#fbbf24;font-weight:900;font-size:20px}
.badge{font-size:11px;background:#f59e0b22;border:1px solid #f59e0b44;color:#fbbf24;padding:5px 10px;border-radius:20px}
.hero{padding:50px 20px 20px;text-align:center}
.hero h1{font-size:36px;font-weight:900}
.hero h1 span{color:#fbbf24}
.coins{display:flex;gap:8px;justify-content:center;padding:15px;flex-wrap:wrap}
.coin{background:#1e293b;border:1px solid #2a364f;padding:8px 14px;border-radius:10px;font-size:13px;font-weight:700}
.plans{padding:10px 16px;display:grid;gap:12px;max-width:460px;margin:0 auto}
.plan{background:#1e293b;border:1px solid #2a364f;border-radius:14px;padding:16px}
.plan.pop{border-color:#f59e0b}
.plan h3{color:#fbbf24}.price{font-size:28px;font-weight:900}
.auth{padding:25px 16px 80px}
.card{background:#1f2c45;border:1px solid #2a3a5a;padding:22px;border-radius:18px;max-width:380px;margin:0 auto}
.card h2{text-align:center;color:#fbbf24}
.sub{text-align:center;color:#64748b;font-size:12px;margin-bottom:12px}
input{width:100%;padding:14px;margin:6px 0;border-radius:10px;border:1px solid #2a3a5a;background:#0f172a;color:#fff}
button{width:100%;padding:14px;margin-top:10px;border-radius:10px;border:none;background:#fbbf24;color:#000;font-weight:900;cursor:pointer}
#btnLogin{background:#233044;color:#fff;border:1px solid #2a3a5a}
.small{font-size:12px;color:#94a3b8;text-align:center;margin-top:8px;min-height:18px}
</style>
</head>
<body>
<nav><div class="logo">CoinCheap 💎</div><div class="badge">● Live Trading</div></nav>
<div class="hero"><h1>Buy Cheap Coins,<br><span>Earn Huge Returns</span></h1></div>
<div class="coins"><div class="coin">₿ BTC</div><div class="coin">Ξ ETH</div><div class="coin">◎ SOL 🚀</div></div>
<div class="plans">
<div class="plan"><h3>Starter</h3><div class="price">$100</div><div style="font-size:12px;color:#94a3b8">10% daily → $10/day</div></div>
<div class="plan pop"><h3>Pro ⭐ MOST POPULAR</h3><div class="price">$500</div><div style="font-size:12px;color:#94a3b8">15% daily → $75/day</div></div>
<div class="plan"><h3>Whale 🐋</h3><div class="price">$1000</div><div style="font-size:12px;color:#94a3b8">20% daily → $200/day</div></div>
</div>
<div class="auth"><div class="card">
<h2>CoinCheap 💎</h2><div class="sub">Old & new users connected</div>
<input id="userEmail" type="email" placeholder="Email e.g. you@gmail.com" autocomplete="email">
<input id="userPass" type="password" placeholder="Password 6+ chars" autocomplete="current-password">
<button id="btnSignup">Create Account →</button>
<button id="btnLogin">Login</button>
<p id="msg" class="small"></p>
<p class="small">Balance: <span id="bal">$0.00</span></p>
</div></div>

<script>
// FIXED FIREBASE + CLICK
const firebaseConfig={
  apiKey:"AIzaSyCLD9yedNA-llM6VU01L9gZ40jv36PlSsw",
  authDomain:"coincheap-investment.firebaseapp.com",
  databaseURL:"https://coincheap-investment-default-rtdb.firebaseio.com",
  projectId:"coincheap-investment",
  storageBucket:"coincheap-investment.firebasestorage.app",
  messagingSenderId:"1065612358336",
  appId:"1:1065612358336:web:1e9b4678e5df622bc9f325"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const eInput = document.getElementById('userEmail');
const pInput = document.getElementById('userPass');
const msg = document.getElementById('msg');
const bal = document.getElementById('bal');

document.getElementById('btnSignup').addEventListener('click', function(){
  const e = eInput.value.trim();
  const p = pInput.value.trim();
  if(!e.includes('@')){msg.textContent='⚠️ Enter correct email';return}
  if(p.length<6){msg.textContent='⚠️ Password 6+ chars';return}
  msg.textContent='Creating...';
  auth.createUserWithEmailAndPassword(e,p)
    .then(c=>db.ref('users/'+c.user.uid).set({email:e.toLowerCase(),balance:0,created:new Date().toISOString()}))
    .then(()=>msg.textContent='✅ Created! Now click Login')
    .catch(err=>msg.textContent='❌ '+err.message);
});

document.getElementById('btnLogin').addEventListener('click', function(){
  const e = eInput.value.trim();
  const p = pInput.value.trim();
  if(!e||!p){msg.textContent='⚠️ Enter email & password';return}
  msg.textContent='Logging...';
  auth.signInWithEmailAndPassword(e,p)
    .then(c=>{
      msg.textContent='✅ Welcome '+e;
      db.ref('users/'+c.user.uid+'/balance').on('value',s=>bal.textContent='$'+(s.val()||0)+'.00');
    })
    .catch(err=>msg.textContent='❌ '+err.message);
});
</script>
<script id="chatway" async="true" src="https://cdn.chatway.app/widget.js?id=YcVV5pL9H0KO"></script>
</body>
</html>
