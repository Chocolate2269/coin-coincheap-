<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMIN</title>
<style>body{margin:0;background:#020617;color:#e2e8f0;padding:12px;font-family:Arial}.btn{padding:10px;border:none;border-radius:8px;font-weight:800;cursor:pointer}.y{background:#f59e0b}.bl{background:#1e3a8a;color:#fff}.card{background:#fff;color:#000;padding:16px;border-radius:12px;margin:10px 0}input{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:2px solid #ccc}.u{background:#0f172a;color:#fff;padding:12px;border-radius:10px;margin:8px 0;display:flex;justify-content:space-between}</style></head><body>
<div id="loginBox" class="card" style="max-width:380px;margin:80px auto"><h2>ADMIN</h2><input id="aPass" type="password" placeholder="coincheap2024"><button class="btn bl" style="width:100%" onclick="login()">Unlock</button><p id="msg"></p></div>
<div id="panel" style="display:none;max-width:650px;margin:0 auto"><h2>ADMIN - ONLINE</h2><div style="display:flex;gap:8px"><div class="card" style="flex:1;text-align:center"><b id="totalUsers">0</b><br>Users</div><div class="card" style="flex:1;text-align:center"><b id="totalBal">$0</b><br>Balance</div></div><button class="btn y" onclick="loadUsers()" style="width:100%;margin:10px 0">🔄 LOAD ALL USERS NOW (Online)</button><div id="usersList"></div><div class="card"><h3>Add Balance</h3><input id="uEmail" placeholder="User Email"><input id="uAmount" type="number" placeholder="Amount"><button class="btn bl" style="width:100%" onclick="addBal()">Add Balance Online</button><p id="addMsg"></p></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {getFirestore,collection,getDocs,doc,getDoc,setDoc} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyCLD9yedNA-llM6VU01L9gZ40jv36PlSsw",authDomain:"coincheap-investment.firebaseapp.com",databaseURL:"https://coincheap-investment-default-rtdb.firebaseio.com",projectId:"coincheap-investment",storageBucket:"coincheap-investment.firebasestorage.app",messagingSenderId:"1065612358336",appId:"1:1065612358336:web:1e9b4678e5df622bc9f325",measurementId:"G-EM6F4CS1C6"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);window.db=db;window.fb={collection,getDocs,doc,getDoc,setDoc};
</script>
<script>
function login(){if(document.getElementById('aPass').value==='coincheap2024'){document.getElementById('loginBox').style.display='none';document.getElementById('panel').style.display='block';loadUsers();}else{document.getElementById('msg').innerText='Wrong';}}
async function loadUsers(){
let list=document.getElementById('usersList');list.innerHTML='Loading online...';
try{
let snap=await fb.getDocs(fb.collection(db,"users"));let html='';let count=0;let total=0;
snap.forEach(d=>{let u=d.data();count++;total+=(u.balance||0);html+=`<div class="u"><div><b>${u.name||'No name'}</b><br><small>${u.email}</small></div><b>$${(u.balance||0).toLocaleString()}</b></div>`;});
if(count==0)html='<div class="card">No users yet online - create account first</div>';
list.innerHTML=html;document.getElementById('totalUsers').innerText=count;document.getElementById('totalBal').innerText='$'+total.toLocaleString();
}catch(e){list.innerHTML='Error: '+e.message+'<br>Check Rules published!';}
}
async function addBal(){
let e=document.getElementById('uEmail').value.trim(),a=parseFloat(document.getElementById('uAmount').value);
if(!e||!a)return;document.getElementById('addMsg').innerText='Updating...';
try{let ref=fb.doc(db,"users",e);let snap=await fb.getDoc(ref);let cur=snap.exists()?(snap.data().balance||0):0;await fb.setDoc(ref,{balance:cur+a,email:e},{merge:true});localStorage.setItem('bal_'+e,cur+a);document.getElementById('addMsg').innerText='✅ $'+a+' added to '+e;loadUsers();}catch(err){document.getElementById('addMsg').innerText=err.message;}
}
</script></body></html>
