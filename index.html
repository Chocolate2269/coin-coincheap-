const db=getFirestore(app);

<script>
async function doSignup(){
 let name=document.getElementById('uName').value.trim(),email=document.getElementById('uEmail').value.trim();
 if(!name||!email){msg.innerText='Fill username & email';return;}
 msg.innerText='Creating...'; err.innerText='';
 localStorage.setItem('userEmail',email); localStorage.setItem('userName',name);
 try{
   // Save to Firestore
   await _setDoc(_doc(db,"users",email),{name:name,email:email,balance:0,created:new Date().toISOString()},{merge:true});
   // Also save to Realtime DB as backup
   await _set(_ref(rdb,'users/'+email.replace(/\./g,'_')),{name:name,email:email,balance:0});
   msg.innerText='✅ Saved! Redirecting...';
   setTimeout(()=>location.href='dashboard.html',900);
 }catch(e){
   err.innerText='FIREBASE ERROR: '+e.message+'\nGo publish Rules!';
   msg.innerText='⚠️ Saving offline - Check Rules!';
   // Save offline so you can still proceed
   setTimeout(()=>{location.href='dashboard.html';},1500);
 }
}
</script>
